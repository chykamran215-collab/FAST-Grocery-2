<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FAST_Grocery Admin Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

</head>

<body class="bg-gray-100">

<div class="flex flex-col md:flex-row min-h-screen">

<!-- SIDEBAR -->

<div class="w-full md:w-64 bg-green-700 text-white p-5">

<h1 class="text-3xl font-bold mb-10">
FAST_Grocery
</h1>

<ul class="space-y-4">

<li class="bg-green-900 p-3 rounded">
Dashboard
</li>

<li class="bg-green-800 p-3 rounded">
Products
</li>

<li class="bg-green-800 p-3 rounded">
Offers
</li>

<li class="bg-green-800 p-3 rounded">
Orders
</li>

<li class="bg-green-800 p-3 rounded">
Customers
</li>

</ul>

</div>

<!-- MAIN -->

<div class="flex-1 p-6">

<!-- TOP -->

<div class="flex justify-between items-center mb-8">

<h2 class="text-3xl font-bold">
Admin Dashboard
</h2>

<button
onclick="logout()"
class="bg-red-600 text-white px-5 py-2 rounded"
>
Logout
</button>

</div>

<!-- STATS -->

<div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">

<div class="bg-white p-5 rounded shadow">

<h3 class="text-gray-500">
Products
</h3>

<p id="totalProducts"
class="text-3xl font-bold text-green-700">
0
</p>

</div>

<div class="bg-white p-5 rounded shadow">

<h3 class="text-gray-500">
Offers
</h3>

<p id="totalOffers"
class="text-3xl font-bold text-red-600">
0
</p>

</div>

<div class="bg-white p-5 rounded shadow">

<h3 class="text-gray-500">
Orders
</h3>

<p id="totalOrders"
class="text-3xl font-bold text-blue-600">
0
</p>

</div>

<div class="bg-white p-5 rounded shadow">

<h3 class="text-gray-500">
Customers
</h3>

<p id="totalCustomers"
class="text-3xl font-bold text-purple-600">
0
</p>

</div>

</div>

<!-- CUSTOMER SEARCH -->

<div class="bg-white p-5 rounded shadow mb-8">

<h3 class="text-2xl font-bold mb-4">
Customer Search
</h3>

<input
id="searchPhone"
type="text"
placeholder="Enter Customer Phone"
class="border p-3 w-full rounded mb-3"
/>

<button
onclick="searchCustomer()"
class="bg-blue-600 text-white px-5 py-3 rounded w-full"
>
Search Customer
</button>

<div id="customerResult" class="mt-5"></div>

</div>

<!-- ADD PRODUCT -->

<div class="bg-white p-5 rounded shadow mb-8">

<h3 class="text-2xl font-bold mb-4">
Add Product
</h3>

<input
id="productName"
type="text"
placeholder="Product Name"
class="border p-3 w-full rounded mb-3"
/>

<input
id="productPrice"
type="number"
placeholder="Product Price"
class="border p-3 w-full rounded mb-3"
/>

<input
id="productImage"
type="text"
placeholder="Product Image URL"
class="border p-3 w-full rounded mb-3"
/>

<button
onclick="addProduct()"
class="bg-green-700 text-white px-5 py-3 rounded w-full"
>
Add Product
</button>

</div>

<!-- PRODUCT LIST -->

<div class="bg-white p-5 rounded shadow mb-8">

<h3 class="text-2xl font-bold mb-4">
Product List
</h3>

<div id="productList"></div>

</div>

<!-- ADD OFFER -->

<div class="bg-white p-5 rounded shadow mb-8">

<h3 class="text-2xl font-bold mb-4">
Add Offer
</h3>

<input
id="offerText"
type="text"
placeholder="Offer Text"
class="border p-3 w-full rounded mb-3"
/>

<button
onclick="addOffer()"
class="bg-red-600 text-white px-5 py-3 rounded w-full"
>
Add Offer
</button>

</div>

<!-- OFFER LIST -->

<div class="bg-white p-5 rounded shadow mb-8">

<h3 class="text-2xl font-bold mb-4">
Offer List
</h3>

<div id="offerList"></div>

</div>

<!-- LIVE ORDERS -->

<div class="bg-white p-5 rounded shadow">

<h3 class="text-2xl font-bold mb-4">
Live Orders
</h3>

<div id="orderList"></div>

</div>

</div>

</div>

<script>

const firebaseConfig = {

apiKey: "AIzaSyCnPVVNkzGiCz1j_3PqzP--SQeJWUmGiSU",

authDomain: "fast-grocery-3322b.firebaseapp.com",

projectId: "fast-grocery-3322b",

storageBucket: "fast-grocery-3322b.firebasestorage.app",

messagingSenderId: "878961129693",

appId: "1:878961129693:web:c06f2dd4fa22ecd4624334",

measurementId: "G-16M82PPJTM"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

const auth = firebase.auth();

auth.onAuthStateChanged(user=>{

if(!user){

window.location.href = "login.html";

}

});

loadStats();
loadProducts();
loadOffers();
loadOrders();


// LOGOUT

async function logout(){

await auth.signOut();

window.location.href = "login.html";

}


// LOAD STATS

async function loadStats(){

const products =
await db.collection("products").get();

document.getElementById("totalProducts").innerText =
products.size;

const offers =
await db.collection("offers").get();

document.getElementById("totalOffers").innerText =
offers.size;

const orders =
await db.collection("orders").get();

document.getElementById("totalOrders").innerText =
orders.size;

let customers = new Set();

orders.forEach(doc=>{

const data = doc.data();

if(data.phone){

customers.add(data.phone);

}

});

document.getElementById("totalCustomers").innerText =
customers.size;

}


// CUSTOMER SEARCH

async function searchCustomer(){

const phone =
document.getElementById("searchPhone").value;

const snapshot =
await db.collection("orders")
.where("phone","==",phone)
.get();

const totalOrders = snapshot.size;

const gift =
totalOrders >= 20
? "🎁 Eligible For Gift"
: "No Gift Yet";

document.getElementById("customerResult").innerHTML = `

<div class="bg-gray-100 p-4 rounded">

<p class="text-xl">
Total Orders:
<b>${totalOrders}</b>
</p>

<p class="mt-2 text-lg">
${gift}
</p>

</div>

`;

}


// ADD PRODUCT

async function addProduct(){

const name =
document.getElementById("productName").value;

const price =
document.getElementById("productPrice").value;

const image =
document.getElementById("productImage").value;

if(name=="" || price=="" || image==""){

alert("Fill All Fields");

return;

}

await db.collection("products").add({

name:name,
price:price,
image:image

});

alert("Product Added");

document.getElementById("productName").value = "";

document.getElementById("productPrice").value = "";

document.getElementById("productImage").value = "";

loadProducts();
loadStats();

}


// LOAD PRODUCTS

async function loadProducts(){

const snapshot =
await db.collection("products").get();

let html = "";

snapshot.forEach(doc=>{

const data = doc.data();

html += `

<div class="border p-4 rounded mb-4 flex justify-between items-center">

<div class="flex items-center gap-4">

<img
src="${data.image}"
class="w-20 h-20 object-cover rounded"
/>

<div>

<h4 class="text-xl font-bold">
${data.name}
</h4>

<p class="text-lg text-green-700 font-semibold">
৳ ${data.price}
</p>

</div>

</div>

<button
onclick="deleteProduct('${doc.id}')"
class="bg-red-500 text-white px-4 py-2 rounded"
>
Delete
</button>

</div>

`;

});

document.getElementById("productList").innerHTML =
html;

}


// DELETE PRODUCT

async function deleteProduct(id){

await db.collection("products")
.doc(id)
.delete();

loadProducts();
loadStats();

}


// ADD OFFER

async function addOffer(){

const text =
document.getElementById("offerText").value;

if(text==""){

alert("Enter Offer");

return;

}

await db.collection("offers").add({

text:text

});

alert("Offer Added");

document.getElementById("offerText").value = "";

loadOffers();
loadStats();

}


// LOAD OFFERS

async function loadOffers(){

const snapshot =
await db.collection("offers").get();

let html = "";

snapshot.forEach(doc=>{

const data = doc.data();

html += `

<div class="border p-4 rounded mb-3 flex justify-between items-center">

<h4 class="text-xl font-bold text-red-600">
${data.text}
</h4>

<button
onclick="deleteOffer('${doc.id}')"
class="bg-red-500 text-white px-4 py-2 rounded"
>
Delete
</button>

</div>

`;

});

document.getElementById("offerList").innerHTML =
html;

}


// DELETE OFFER

async function deleteOffer(id){

await db.collection("offers")
.doc(id)
.delete();

loadOffers();
loadStats();

}


// LOAD ORDERS

async function loadOrders(){

const snapshot =
await db.collection("orders")
.orderBy("time","desc")
.get();

let html = "";

snapshot.forEach(doc=>{

const data = doc.data();

html += `

<div class="border p-4 rounded mb-4 bg-gray-50">

<div class="flex justify-between items-start gap-4">

<div>

<p class="mb-1">
<b>👤 Name:</b>
${data.name || "No Name"}
</p>

<p class="mb-1">
<b>📞 Phone:</b>
${data.phone || "No Phone"}
</p>

<p class="mb-1">
<b>📍 Address:</b>
${data.address || "No Address"}
</p>

<p class="mb-1">
<b>🛒 Items:</b>
${data.items || "No Items"}
</p>

<p class="mb-1">
<b>💰 Total:</b>
৳ ${data.total || "0"}
</p>

<p class="mb-1">
<b>📦 Status:</b>

<span class="
${data.status=="Completed"
? "text-green-600"
: "text-orange-600"}
font-bold
">

${data.status || "Pending"}

</span>

</p>

</div>

<div class="flex flex-col gap-2">

<button
onclick="completeOrder('${doc.id}')"
class="bg-green-600 text-white px-4 py-2 rounded"
>
Complete
</button>

<button
onclick="deleteOrder('${doc.id}')"
class="bg-red-600 text-white px-4 py-2 rounded"
>
Delete
</button>

</div>

</div>

</div>

`;

});

document.getElementById("orderList").innerHTML =
html;

}


// COMPLETE ORDER

async function completeOrder(id){

await db.collection("orders")
.doc(id)
.update({

status:"Completed"

});

loadOrders();

}


// DELETE ORDER

async function deleteOrder(id){

await db.collection("orders")
.doc(id)
.delete();

loadOrders();
loadStats();

}

</script>

</body>
</html>
