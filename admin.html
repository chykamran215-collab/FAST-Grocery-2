<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FAST_Grocery Admin</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

</head>

<body class="bg-gray-100">

<div class="flex">

<!-- SIDEBAR -->

<div class="w-64 bg-green-700 min-h-screen text-white p-5">

<h1 class="text-3xl font-bold mb-10">
FAST_Grocery
</h1>

<ul class="space-y-4">

<li class="bg-green-900 p-3 rounded">
Dashboard
</li>

<li class="p-3 rounded bg-green-800">
Products
</li>

<li class="p-3 rounded bg-green-800">
Offers
</li>

</ul>

</div>

<!-- MAIN -->

<div class="flex-1 p-6">

<h2 class="text-3xl font-bold mb-6">
Admin Dashboard
</h2>

<!-- PRODUCT SECTION -->

<div class="bg-white p-5 rounded shadow mb-8">

<h3 class="text-2xl font-bold mb-4">
Add Product
</h3>

<input
id="productName"
type="text"
placeholder="Product Name"
class="border p-3 w-full rounded mb-3"
/>

<input
id="productPrice"
type="text"
placeholder="Product Price"
class="border p-3 w-full rounded mb-3"
/>

<button
onclick="addProduct()"
class="bg-green-700 text-white px-5 py-3 rounded"
>
Add Product
</button>

</div>

<!-- PRODUCT LIST -->

<div class="bg-white p-5 rounded shadow mb-8">

<h3 class="text-2xl font-bold mb-4">
Product List
</h3>

<div id="productList"></div>

</div>

<!-- OFFER SECTION -->

<div class="bg-white p-5 rounded shadow mb-8">

<h3 class="text-2xl font-bold mb-4">
Add Offer
</h3>

<input
id="offerText"
type="text"
placeholder="Offer Text"
class="border p-3 w-full rounded mb-3"
/>

<button
onclick="addOffer()"
class="bg-red-600 text-white px-5 py-3 rounded"
>
Add Offer
</button>

</div>

<!-- OFFER LIST -->

<div class="bg-white p-5 rounded shadow">

<h3 class="text-2xl font-bold mb-4">
Offer List
</h3>

<div id="offerList"></div>

</div>

</div>

</div>

<script>

const firebaseConfig = {

apiKey: "AIzaSyCnPVVNkzGiCz1j_3PqzP--SQeJWUmGiSU",

authDomain: "fast-grocery-3322b.firebaseapp.com",

projectId: "fast-grocery-3322b",

storageBucket: "fast-grocery-3322b.firebasestorage.app",

messagingSenderId: "878961129693",

appId: "1:878961129693:web:c06f2dd4fa22ecd4624334",

measurementId: "G-16M82PPJTM"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

loadProducts();
loadOffers();


// ADD PRODUCT

async function addProduct(){

const name =
document.getElementById("productName").value;

const price =
document.getElementById("productPrice").value;

await db.collection("products").add({

name:name,
price:price

});

alert("Product Added");

document.getElementById("productName").value = "";
document.getElementById("productPrice").value = "";

loadProducts();

}


// LOAD PRODUCTS

async function loadProducts(){

const snapshot =
await db.collection("products").get();

let html = "";

snapshot.forEach(doc=>{

const data = doc.data();

html += `

<div class="border p-4 rounded mb-3 flex justify-between">

<div>

<h4 class="text-xl font-bold">
${data.name}
</h4>

<p>
৳ ${data.price}
</p>

</div>

<button
onclick="deleteProduct('${doc.id}')"
class="bg-red-500 text-white px-4 py-2 rounded"
>
Delete
</button>

</div>

`;

});

document.getElementById("productList").innerHTML =
html;

}


// DELETE PRODUCT

async function deleteProduct(id){

await db.collection("products").doc(id).delete();

loadProducts();

}


// ADD OFFER

async function addOffer(){

const text =
document.getElementById("offerText").value;

await db.collection("offers").add({

text:text

});

alert("Offer Added");

document.getElementById("offerText").value = "";

loadOffers();

}


// LOAD OFFERS

async function loadOffers(){

const snapshot =
await db.collection("offers").get();

let html = "";

snapshot.forEach(doc=>{

const data = doc.data();

html += `

<div class="border p-4 rounded mb-3 flex justify-between">

<div>

<h4 class="text-xl font-bold text-red-600">
${data.text}
</h4>

</div>

<button
onclick="deleteOffer('${doc.id}')"
class="bg-red-500 text-white px-4 py-2 rounded"
>
Delete
</button>

</div>

`;

});

document.getElementById("offerList").innerHTML =
html;

}


// DELETE OFFER

async function deleteOffer(id){

await db.collection("offers").doc(id).delete();

loadOffers();

}

</script>

</body>
</html>
