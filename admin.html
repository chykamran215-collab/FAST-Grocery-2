<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FAST_Grocery Professional Admin</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

</head>

<body class="bg-gray-100">

<!-- LOGIN SCREEN -->

<div id="loginScreen" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50">

<div class="bg-white p-10 rounded-3xl shadow-2xl w-[90%] max-w-md">

<h2 class="text-3xl font-bold text-center text-green-700 mb-8">
FAST_Grocery Admin Login
</h2>

<input
type="email"
id="adminEmail"
placeholder="Admin Email"
class="border-2 border-gray-200 p-4 rounded-xl w-full mb-4"
/>

<input
type="password"
id="adminPassword"
placeholder="Password"
class="border-2 border-gray-200 p-4 rounded-xl w-full mb-6"
/>

<button
onclick="adminLogin()"
class="bg-green-600 hover:bg-green-700 text-white w-full py-4 rounded-2xl text-xl font-bold">

Login

</button>

<p id="loginError" class="text-red-500 text-center mt-4"></p>

</div>

</div>

<div class="flex">

<!-- SIDEBAR -->

<div class="w-64 bg-green-700 min-h-screen text-white p-5">

<h1 class="text-3xl font-bold mb-10">
FAST_Grocery
</h1>

<ul class="space-y-4">

<li class="bg-green-900 p-3 rounded">
Dashboard
</li>

<li class="bg-green-800 p-3 rounded">
Orders
</li>

<li class="bg-green-800 p-3 rounded">
Products
</li>

<li class="bg-green-800 p-3 rounded">
Offers
</li>

<li class="bg-green-800 p-3 rounded">
Customers
</li>

<li
onclick="logout()"
class="bg-red-500 hover:bg-red-700 p-3 rounded cursor-pointer">

Logout

</li>

</ul>

</div>

<!-- MAIN -->

<div class="flex-1 p-6">

<h2 class="text-4xl font-bold mb-8">
Professional Admin Dashboard
</h2>

<!-- STATS -->

<div class="grid md:grid-cols-4 gap-5 mb-10">

<div class="bg-white p-6 rounded-2xl shadow">
<h3 class="text-gray-500 mb-2">Total Orders</h3>
<p id="totalOrders" class="text-4xl font-bold text-green-700">
0
</p>
</div>

<div class="bg-white p-6 rounded-2xl shadow">
<h3 class="text-gray-500 mb-2">Pending</h3>
<p id="pendingOrders" class="text-4xl font-bold text-yellow-500">
0
</p>
</div>

<div class="bg-white p-6 rounded-2xl shadow">
<h3 class="text-gray-500 mb-2">Completed</h3>
<p id="completedOrders" class="text-4xl font-bold text-blue-600">
0
</p>
</div>

<div class="bg-white p-6 rounded-2xl shadow">
<h3 class="text-gray-500 mb-2">Customers</h3>
<p id="customers" class="text-4xl font-bold text-red-600">
0
</p>
</div>

</div>

<!-- CUSTOMER SEARCH -->

<div class="bg-white p-6 rounded-2xl shadow mb-10">

<h3 class="text-2xl font-bold mb-5">
Customer Search
</h3>

<input
type="text"
id="searchPhone"
placeholder="Enter Customer Phone"
class="border p-4 rounded-xl w-full"
/>

<button
onclick="searchCustomer()"
class="bg-green-700 text-white px-6 py-3 rounded-xl mt-4">

Search Customer

</button>

<div id="customerResult" class="mt-6"></div>

</div>

<!-- PRODUCT SECTION -->

<div class="bg-white p-6 rounded-2xl shadow mb-10">

<h3 class="text-2xl font-bold mb-5">
Add Product
</h3>

<input
id="productName"
type="text"
placeholder="Product Name"
class="border p-4 rounded-xl w-full mb-4"
/>

<input
id="productPrice"
type="text"
placeholder="Product Price"
class="border p-4 rounded-xl w-full mb-4"
/>

<input
id="productImage"
type="text"
placeholder="Paste Product Image URL"
class="border p-4 rounded-xl w-full mb-4"
/>

<button
onclick="addProduct()"
class="bg-green-700 text-white px-6 py-3 rounded-xl">

Add Product

</button>

</div>

<!-- PRODUCT LIST -->

<div class="bg-white p-6 rounded-2xl shadow mb-10">

<h3 class="text-2xl font-bold mb-5">
Product List
</h3>

<div id="productList"></div>

</div>

<!-- OFFER SECTION -->

<div class="bg-white p-6 rounded-2xl shadow mb-10">

<h3 class="text-2xl font-bold mb-5">
Add Offer
</h3>

<input
id="offerText"
type="text"
placeholder="Offer Text"
class="border p-4 rounded-xl w-full mb-4"
/>

<button
onclick="addOffer()"
class="bg-red-600 text-white px-6 py-3 rounded-xl">

Add Offer

</button>

</div>

<!-- OFFER LIST -->

<div class="bg-white p-6 rounded-2xl shadow mb-10">

<h3 class="text-2xl font-bold mb-5">
Offer List
</h3>

<div id="offerList"></div>

</div>

<!-- LIVE ORDERS -->

<div class="bg-white p-6 rounded-2xl shadow">

<h3 class="text-2xl font-bold mb-5">
Live Orders
</h3>

<div id="orderList"></div>

</div>

</div>

</div>

<!-- FIREBASE -->

<script>

const firebaseConfig = {

apiKey: "YOUR_API_KEY",

authDomain: "YOUR_AUTH_DOMAIN",

projectId: "YOUR_PROJECT_ID",

storageBucket: "YOUR_STORAGE_BUCKET",

messagingSenderId: "YOUR_SENDER_ID",

appId: "YOUR_APP_ID"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

const auth = firebase.auth();

</script>

<!-- LOGIN -->

<script>

function adminLogin(){

const email =
document.getElementById("adminEmail").value;

const password =
document.getElementById("adminPassword").value;

auth.signInWithEmailAndPassword(email,password)

.then(()=>{

document.getElementById("loginScreen").style.display = "none";

})

.catch(()=>{

document.getElementById("loginError").innerText =
"Wrong Email or Password";

});

}

auth.onAuthStateChanged((user)=>{

if(user){

document.getElementById("loginScreen").style.display = "none";

}else{

document.getElementById("loginScreen").style.display = "flex";

}

});

function logout(){

auth.signOut();

}

</script>

<!-- DASHBOARD -->

<script>

loadDashboard();
loadProducts();
loadOffers();
loadOrders();

async function loadDashboard(){

const orders =
await db.collection("orders").get();

document.getElementById("totalOrders").innerText =
orders.size;

let pending = 0;
let completed = 0;

let customers = new Set();

orders.forEach(doc=>{

const data = doc.data();

customers.add(data.phone);

if(data.status == "Completed"){
completed++;
}else{
pending++;
}

});

document.getElementById("pendingOrders").innerText =
pending;

document.getElementById("completedOrders").innerText =
completed;

document.getElementById("customers").innerText =
customers.size;

}

</script>

<!-- CUSTOMER SEARCH -->

<script>

async function searchCustomer(){

const phone =
document.getElementById("searchPhone").value;

const snapshot =
await db.collection("orders")
.where("phone","==",phone)
.get();

let totalOrders = snapshot.size;

let gift =
totalOrders >= 20
? "🎁 Eligible For Special Gift"
: "No Gift Yet";

document.getElementById("customerResult").innerHTML = `

<div class="bg-gray-100 p-5 rounded-2xl">

<p class="text-xl mb-3">
📞 Phone:
<b>${phone}</b>
</p>

<p class="text-xl mb-3">
🛒 Total Orders:
<b>${totalOrders}</b>
</p>

<p class="text-xl text-green-700 font-bold">
${gift}
</p>

</div>

`;

}

</script>

<!-- PRODUCTS -->

<script>

async function addProduct(){

const name =
document.getElementById("productName").value;

const price =
document.getElementById("productPrice").value;

const image =
document.getElementById("productImage").value;

await db.collection("products").add({

name:name,
price:price,
image:image

});

alert("Product Added Successfully");

loadProducts();

}

async function loadProducts(){

const snapshot =
await db.collection("products").get();

let html = "";

snapshot.forEach(doc=>{

const data = doc.data();

html += `

<div class="border p-5 rounded-2xl mb-4">

<img
src="${data.image}"
class="w-full h-52 object-cover rounded-2xl mb-4">

<h3 class="text-2xl font-bold mb-3">
${data.name}
</h3>

<p class="text-xl text-green-700 font-bold mb-4">
৳ ${data.price}
</p>

<button
onclick="deleteProduct('${doc.id}')"
class="bg-red-500 text-white px-5 py-2 rounded-xl">

Delete

</button>

</div>

`;

});

document.getElementById("productList").innerHTML =
html;

}

async function deleteProduct(id){

await db.collection("products").doc(id).delete();

loadProducts();

}

</script>

<!-- OFFERS -->

<script>

async function addOffer(){

const text =
document.getElementById("offerText").value;

await db.collection("offers").add({

text:text

});

alert("Offer Added");

loadOffers();

}

async function loadOffers(){

const snapshot =
await db.collection("offers").get();

let html = "";

snapshot.forEach(doc=>{

const data = doc.data();

html += `

<div class="border p-5 rounded-2xl mb-4 flex justify-between">

<h3 class="text-xl font-bold text-red-600">
${data.text}
</h3>

<button
onclick="deleteOffer('${doc.id}')"
class="bg-red-500 text-white px-5 py-2 rounded-xl">

Delete

</button>

</div>

`;

});

document.getElementById("offerList").innerHTML =
html;

}

async function deleteOffer(id){

await db.collection("offers").doc(id).delete();

loadOffers();

}

</script>

<!-- LIVE ORDERS -->

<script>

async function loadOrders(){

const snapshot =
await db.collection("orders")
.orderBy("time","desc")
.get();

let html = "";

snapshot.forEach(doc=>{

const data = doc.data();

html += `

<div class="border p-5 rounded-2xl mb-5 bg-gray-50">

<div class="grid md:grid-cols-2 gap-5">

<div>

<p class="mb-2 text-lg">
👤 <b>${data.name}</b>
</p>

<p class="mb-2">
📞 ${data.phone}
</p>

<p class="mb-2">
📍 ${data.address}
</p>

<p class="mb-2">
📦 ${data.product}
</p>

</div>

<div>

<p class="mb-3 text-lg">
Current Status:
<span class="font-bold text-blue-600">
${data.status || "Pending"}
</span>
</p>

<select
onchange="updateStatus('${doc.id}',this.value)"
class="border-2 border-gray-300 p-3 rounded-xl w-full mb-4">

<option value="Pending"
${data.status=="Pending"?"selected":""}>
Pending
</option>

<option value="Processing"
${data.status=="Processing"?"selected":""}>
Processing
</option>

<option value="Delivered"
${data.status=="Delivered"?"selected":""}>
Delivered
</option>

<option value="Cancelled"
${data.status=="Cancelled"?"selected":""}>
Cancelled
</option>

</select>

<div class="flex gap-3">

<button
onclick="deleteOrder('${doc.id}')"
class="bg-red-600 text-white px-5 py-2 rounded-xl">

Delete

</button>

</div>

</div>

</div>

</div>

`;

});

document.getElementById("orderList").innerHTML =
html;

}

async function updateStatus(id,status){

await db.collection("orders")
.doc(id)
.update({

status:status

});

loadOrders();
loadDashboard();

}

async function deleteOrder(id){

await db.collection("orders")
.doc(id)
.delete();

loadOrders();
loadDashboard();

}

</script>

</body>
</html>
