<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FAST_Grocery Admin</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>

body{
background:#f3f4f6;
font-family:Arial;
}

</style>

</head>

<body>

<div class="flex">

<!-- SIDEBAR -->

<div class="w-64 bg-green-700 min-h-screen text-white p-5">

<h1 class="text-3xl font-bold mb-10">
FAST_Grocery
</h1>

<ul class="space-y-4">

<li class="bg-green-900 p-3 rounded">
Dashboard
</li>

<li class="hover:bg-green-800 p-3 rounded">
Orders
</li>

<li class="hover:bg-green-800 p-3 rounded">
Products
</li>

<li class="hover:bg-green-800 p-3 rounded">
Offers
</li>

<li class="hover:bg-green-800 p-3 rounded">
Customers
</li>

</ul>

</div>

<!-- MAIN -->

<div class="flex-1 p-6">

<h2 class="text-3xl font-bold mb-6">
Admin Dashboard
</h2>

<!-- STATS -->

<div class="grid grid-cols-1 md:grid-cols-4 gap-4">

<div class="bg-white p-5 rounded shadow">
<h3 class="text-gray-500">Total Orders</h3>
<p id="totalOrders" class="text-3xl font-bold">0</p>
</div>

<div class="bg-white p-5 rounded shadow">
<h3 class="text-gray-500">Customers</h3>
<p id="totalCustomers" class="text-3xl font-bold">0</p>
</div>

<div class="bg-white p-5 rounded shadow">
<h3 class="text-gray-500">Completed</h3>
<p id="completedOrders" class="text-3xl font-bold">0</p>
</div>

<div class="bg-white p-5 rounded shadow">
<h3 class="text-gray-500">Pending</h3>
<p id="pendingOrders" class="text-3xl font-bold">0</p>
</div>

</div>

<!-- CUSTOMER SEARCH -->

<div class="bg-white mt-8 p-5 rounded shadow">

<h3 class="text-2xl font-bold mb-4">
Customer Search
</h3>

<input
type="text"
id="searchPhone"
placeholder="Enter phone number"
class="border p-3 w-full rounded"
/>

<button
onclick="searchCustomer()"
class="bg-green-700 text-white px-5 py-3 rounded mt-4"
>
Search
</button>

<div id="customerResult" class="mt-5"></div>

</div>

</div>

</div>

<script>

const firebaseConfig = {

apiKey: "AIzaSyCnPVVNkzGiCz1j_3PqzP--SQeJWUmGiSU",

authDomain: "fast-grocery-3322b.firebaseapp.com",

projectId: "fast-grocery-3322b",

storageBucket: "fast-grocery-3322b.firebasestorage.app",

messagingSenderId: "878961129693",

appId: "1:878961129693:web:c06f2dd4fa22ecd4624334",

measurementId: "G-16M82PPJTM"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

loadDashboard();

async function loadDashboard(){

const snapshot = await db.collection("orders").get();

document.getElementById("totalOrders").innerText =
snapshot.size;

let completed = 0;
let pending = 0;

let customers = new Set();

snapshot.forEach(doc => {

const data = doc.data();

customers.add(data.phone);

if(data.status == "completed"){
completed++;
}
else{
pending++;
}

});

document.getElementById("completedOrders").innerText =
completed;

document.getElementById("pendingOrders").innerText =
pending;

document.getElementById("totalCustomers").innerText =
customers.size;

}

async function searchCustomer(){

const phone =
document.getElementById("searchPhone").value;

const snapshot = await db
.collection("orders")
.where("phone","==",phone)
.get();

let totalOrders = snapshot.size;

let gift =
totalOrders >= 20
? "🎁 Eligible For Gift"
: "No Gift Yet";

document.getElementById("customerResult").innerHTML = `

<div class="bg-gray-100 p-4 rounded">

<p class="text-xl">
Total Orders:
<b>${totalOrders}</b>
</p>

<p class="mt-2 text-lg">
${gift}
</p>

</div>

`;

}

</script>

</body>
</html>
