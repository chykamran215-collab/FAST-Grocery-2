<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FAST_Grocery Cart</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

<div class="max-w-5xl mx-auto p-6">

<h1 class="text-4xl font-bold text-green-700 mb-8">
🛒 Your Cart
</h1>

<div id="cartItems"></div>

<div class="mt-8">

<h2 class="text-3xl font-bold">
Total:
৳ <span id="totalPrice">0</span>
</h2>

<a href="index.html"
class="inline-block mt-5 bg-green-600 text-white px-6 py-3 rounded-xl">

⬅ Continue Shopping

</a>

</div>

</div>

<script>

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

function loadCart(){

let html = "";

let total = 0;

cart.forEach((item,index)=>{

total += Number(item.price);

html += `

<div class="bg-white p-5 rounded-2xl shadow mb-5 flex justify-between items-center">

<div>

<img
src="${item.image}"
class="w-32 h-32 object-cover rounded-xl mb-3">

<h2 class="text-2xl font-bold">
${item.name}
</h2>

<p class="text-green-700 font-bold text-xl">
৳ ${item.price}
</p>

</div>

<button
onclick="removeItem(${index})"
class="bg-red-600 text-white px-5 py-2 rounded-xl">

Remove

</button>

</div>

`;

});

document.getElementById("cartItems").innerHTML = html;

document.getElementById("totalPrice").innerText = total;

}

function removeItem(index){

cart.splice(index,1);

localStorage.setItem("cart",JSON.stringify(cart));

loadCart();

}

loadCart();

</script>

</body>
</html>
