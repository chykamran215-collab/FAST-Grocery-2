<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Tracking</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

</head>

<body class="bg-gray-100">

<div class="max-w-3xl mx-auto p-6">

<h1 class="text-4xl font-bold text-green-700 mb-8">
📦 Order Tracking
</h1>

<div class="bg-white p-6 rounded-2xl shadow">

<input
type="text"
id="phone"
placeholder="Enter Phone Number"
class="border p-4 rounded-xl w-full mb-4"
/>

<button
onclick="trackOrder()"
class="bg-green-700 text-white px-6 py-3 rounded-xl">

Track Order

</button>

<div id="result" class="mt-8"></div>

</div>

</div>

<script>

const firebaseConfig = {

apiKey: "AIzaSyCnPVVNkzGiCz1j_3PqzP--SQeJWUmGiSU",

authDomain: "fast-grocery-3322b.firebaseapp.com",

projectId: "fast-grocery-3322b",

storageBucket: "fast-grocery-3322b.appspot.com",

messagingSenderId: "878961129693",

appId: "1:878961129693:web:c06f2dd4fa22ecd4624334"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

async function trackOrder(){

const phone =
document.getElementById("phone").value;

const snapshot =
await db.collection("orders")
.where("phone","==",phone)
.get();

let html = "";

snapshot.forEach(doc=>{

const data = doc.data();

html += `

<div class="border p-5 rounded-2xl mb-5">

<h2 class="text-2xl font-bold mb-3">
${data.product}
</h2>

<p class="mb-2">
👤 ${data.name}
</p>

<p class="mb-2">
📍 ${data.address}
</p>

<p class="mb-2 text-blue-600 font-bold">
📦 Status:
${data.status}
</p>

</div>

`;

});

document.getElementById("result").innerHTML = html;

}

</script>

</body>
</html>
